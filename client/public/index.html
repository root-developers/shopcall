<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
  <meta name="theme-color" content="#6366f1" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- SEO -->
  <title>ShopCall - Live Video Shopping for E-commerce Stores | Add Live Shop Button</title>
  <meta name="description" content="Add a Live Shop video call button to your e-commerce store with just 2 lines of code. Connect with customers via HD video, show products live, and close sales 3x faster. Free trial, no credit card needed." />
  <meta name="keywords" content="live video commerce, live shopping, video call widget, e-commerce video, live shop button, video commerce SDK, shopify live video, woocommerce video call, live selling India, video shopping platform" />
  <meta name="author" content="ShopCall" />
  <link rel="canonical" href="https://shopcall.store" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://shopcall.store" />
  <meta property="og:title" content="ShopCall - Turn Your Website Into a Live Showroom" />
  <meta property="og:description" content="One script tag adds a Live Shop button. Customers click, you connect via video, show products, and close the deal. Setup in under 2 minutes." />
  <meta property="og:image" content="https://shopcall.store/og-image.png" />
  <meta property="og:site_name" content="ShopCall" />
  <meta property="og:locale" content="en_IN" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="ShopCall - Live Video Shopping for E-commerce" />
  <meta name="twitter:description" content="Add live video shopping to any store with 2 lines of code. 3x more conversions. Free trial." />
  <meta name="twitter:image" content="https://shopcall.store/og-image.png" />

  <!-- Structured Data - SoftwareApplication -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "ShopCall",
    "applicationCategory": "BusinessApplication",
    "operatingSystem": "Web",
    "description": "Live video commerce SDK for e-commerce stores. Add a Live Shop video call button with 2 lines of code.",
    "url": "https://shopcall.store",
    "offers": [
      {
        "@type": "Offer",
        "name": "Free",
        "price": "0",
        "priceCurrency": "INR",
        "description": "5 free customer calls, 1 agent"
      },
      {
        "@type": "Offer",
        "name": "Starter",
        "price": "999",
        "priceCurrency": "INR",
        "description": "200 calls/month, 3 agents"
      },
      {
        "@type": "Offer",
        "name": "Pro",
        "price": "2999",
        "priceCurrency": "INR",
        "description": "Unlimited calls, 10 agents"
      }
    ],
    "aggregateRating": {
      "@type": "AggregateRating",
      "ratingValue": "4.8",
      "ratingCount": "120"
    }
  }
  </script>

  <!-- Structured Data - Organization -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "ShopCall",
    "url": "https://shopcall.store",
    "logo": "https://shopcall.store/logo512.png",
    "sameAs": []
  }
  </script>

  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/logo192.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <noscript>You need to enable JavaScript to run ShopCall.</noscript>
  <div id="root"></div>
</body>
</html>
